services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://attendance:attendance@db:5432/attendance?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      NEXT_PUBLIC_APP_URL: https://attend.progroupe.cloud
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.pro-attendance.rule=Host(`attend.progroupe.cloud`)
      - traefik.http.routers.pro-attendance.tls=true
      - traefik.http.routers.pro-attendance.entrypoints=web,websecure
      - traefik.http.routers.pro-attendance.tls.certresolver=mytlschallenge
      - traefik.http.services.pro-attendance.loadbalancer.server.port=3000

volumes:
  postgres_data:

networks:
  default:
  n8n_default:
    external: true
